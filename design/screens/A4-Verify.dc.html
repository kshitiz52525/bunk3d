<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Verify your campus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 16px 22px 30px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a href="A3-College.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5; letter-spacing: 1px">STEP 3 OF 7</span>
<span style="width: 44px"></span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
<span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span>
</div>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 24px"><span style="width: 36px; height: 36px; border-radius: 12px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 11px; font-weight: 800">AU</span><span style="font-size: 14px; font-weight: 700">Atria University</span></div>
<h1 style="margin: 16px 0 6px; font-family: Unbounded, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1.05">Prove you’re<br>a real student</h1>
<p style="margin: 0 0 18px; font-size: 14px; color: #9A9AA5">Takes 30 seconds with your college email.</p>

<div style="display: flex; background: #17171B; border-radius: 16px; padding: 4px; gap: 4px">
<button onClick="{{setEmail}}" style="flex: 1; border: 0; background: {{emailBg}}; color: {{emailFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">College email</button>
<button onClick="{{setId}}" style="flex: 1; border: 0; background: {{idBg}}; color: {{idFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">Student ID</button>
</div>

<sc-if value="{{email}}" hint-placeholder-val="{{true}}">
<label for="em" style="font-size: 12px; font-weight: 800; color: #9A9AA5; margin-top: 18px">College email</label>
<div style="display: flex; align-items: center; height: 54px; margin-top: 8px; background: #17171B; border: 1.5px solid #D4FF3A; border-radius: 14px; padding: 0 14px">
<input id="em" value="aarav.sharma" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F5F5F0; font: inherit; font-size: 15px; font-weight: 700; outline: none">
<span style="font-size: 14px; color: #9A9AA5; font-weight: 600">@atriauniversity.edu.in</span>
</div>
<div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; background: #123D2C; color: #3DDC97; border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Code sent — check your inbox</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; margin-top: 12px">
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #4A4A54; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800">8</span>
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #4A4A54; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800">2</span>
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #D4FF3A"></span>
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #2E2E36"></span>
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #2E2E36"></span>
<span style="height: 52px; border-radius: 12px; background: #17171B; border: 2px solid #2E2E36"></span>
</div>
<div style="flex: 1"></div>
<a href="A6-Profile.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Verify &amp; continue</a>
</sc-if>

<sc-if value="{{idPath}}" hint-placeholder-val="{{false}}">
<button style="margin-top: 18px; height: 200px; border: 2px dashed #4A4A54; border-radius: 20px; background: #17171B; color: #F5F5F0; font: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<span style="width: 56px; height: 56px; border-radius: 18px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
<span style="font-size: 15px; font-weight: 800">Snap your student ID</span>
<span style="font-size: 12px; color: #9A9AA5">Front side · name and college visible</span>
</button>
<div style="display: flex; gap: 10px; margin-top: 12px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 12px; font-size: 13px; color: #C9C9C3; line-height: 1.45">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#B49CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
<span>Only Bunk3d staff see it. Deleted 30 days after review. Usually checked within 24 hours.</span>
</div>
<div style="flex: 1"></div>
<a href="A5-Pending.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Submit ID</a>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'email' }; }
renderVals() {
const e = this.state.mode === 'email';
return {
email: e, idPath: !e,
emailBg: e ? '#D4FF3A' : 'transparent', emailFg: e ? '#0D0D0F' : '#9A9AA5',
idBg: e ? 'transparent' : '#D4FF3A', idFg: e ? '#9A9AA5' : '#0D0D0F',
setEmail: () => this.setState({ mode: 'email' }), setId: () => this.setState({ mode: 'id' })
};
}
}
</script>
</body>
</html>

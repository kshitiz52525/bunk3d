<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Profile basics</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 16px 22px 30px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<sc-if value="{{ovHas}}" hint-placeholder-val="{{false}}"><a href="#back" onClick="{{ovBack}}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if><sc-if value="{{ovNo}}" hint-placeholder-val="{{true}}"><a href="A4-Verify.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5; letter-spacing: 1px">STEP 4 OF 7</span>
<span style="width: 44px"></span>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
<span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span>
</div>

<sc-if value="{{adult}}" hint-placeholder-val="{{true}}">
<h1 style="margin: 22px 0 16px; font-family: Unbounded, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px">Who dis?</h1>
<div style="display: flex; gap: 14px; align-items: center">
<button aria-label="Add photo (optional)" style="width: 84px; height: 84px; flex-shrink: 0; border: 0; border-radius: 28px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; transform: rotate(-4deg); box-shadow: 4px 4px 0 #B49CFF"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
<div style="flex: 1; display: flex; flex-direction: column; gap: 8px">
<input aria-label="Full name" value="Aarav Sharma" style="height: 46px; box-sizing: border-box; padding: 0 12px; background: #17171B; border: 1px solid #2E2E36; border-radius: 12px; color: #F5F5F0; font: inherit; font-size: 15px; font-weight: 700">
<div style="display: flex; align-items: center; height: 46px; padding: 0 12px; background: #17171B; border: 1.5px solid #3DDC97; border-radius: 12px">
<span style="color: #9A9AA5; font-weight: 700">@</span><input aria-label="Username" value="aarav.builds" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F5F5F0; font: inherit; font-size: 15px; font-weight: 700; outline: none">
<span style="font-size: 11px; font-weight: 800; color: #3DDC97">free</span>
</div>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 16px">
<div style="background: #17171B; border: 1px solid #2E2E36; border-radius: 12px; padding: 9px 11px"><div style="font-size: 10px; font-weight: 800; color: #9A9AA5">DEGREE</div><div style="font-size: 14px; font-weight: 700">B.Tech ▾</div></div>
<div style="background: #17171B; border: 1px solid #2E2E36; border-radius: 12px; padding: 9px 11px"><div style="font-size: 10px; font-weight: 800; color: #9A9AA5">DEPT</div><div style="font-size: 14px; font-weight: 700">CSE ▾</div></div>
<div style="background: #17171B; border: 1px solid #2E2E36; border-radius: 12px; padding: 9px 11px"><div style="font-size: 10px; font-weight: 800; color: #9A9AA5">YEAR</div><div style="font-size: 14px; font-weight: 700">3rd ▾</div></div>
</div>
<label for="dob" style="font-size: 12px; font-weight: 800; color: #9A9AA5; margin-top: 16px">Date of birth</label>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 8px; height: 50px; padding: 0 12px; background: #17171B; border: 1px solid #2E2E36; border-radius: 12px">
<input id="dob" value="14 / 03 / 2005" style="flex: 1; min-width: 0; border: 0; background: transparent; color: #F5F5F0; font: inherit; font-size: 15px; font-weight: 700; outline: none">
<span style="display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 800; color: #B49CFF"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>never shown</span>
</div>
<div style="flex: 1"></div>
<button onClick="{{toggle}}" style="border: 0; background: none; color: #9A9AA5; font: inherit; font-size: 12px; font-weight: 700; min-height: 36px; margin-bottom: 6px">Preview: under-18 date of birth</button>
<a href="A7-Interests.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Next</a>
</sc-if>

<sc-if value="{{minor}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center">
<span style="align-self: flex-start; background: #FF6B9A; color: #0D0D0F; font-size: 13px; font-weight: 800; padding: 7px 12px; border-radius: 20px; transform: rotate(-4deg)">18+ for now</span>
<h1 style="margin: 18px 0 10px; font-family: Unbounded, sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -1px; line-height: 1.1">Bunk3d is only for students 18 and over right now.</h1>
<p style="margin: 0; font-size: 15px; color: #9A9AA5; line-height: 1.5">We’ve deleted what you entered. We’ll let you know if that changes — no hard feelings.</p>
</div>
<button onClick="{{toggle}}" style="border: 0; background: #1F1F25; color: #F5F5F0; font: inherit; font-size: 15px; font-weight: 700; min-height: 56px; border-radius: 16px">Close</button>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"back":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { minor: false }; }
_rv() {
return { adult: !this.state.minor, minor: this.state.minor, toggle: () => this.setState({ minor: !this.state.minor }) };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
[].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

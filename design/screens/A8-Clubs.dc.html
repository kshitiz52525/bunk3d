<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Join clubs and follow notices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 16px 22px 30px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<a href="A7-Interests.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5; letter-spacing: 1px">STEP 6 OF 7</span>
<a href="A9-Guidelines.dc.html" style="min-width: 44px; text-align: right; font-size: 14px; font-weight: 700; color: #9A9AA5; text-decoration: none">Skip</a>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
<span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span>
</div>

<h1 style="margin: 22px 0 4px; font-family: Unbounded, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: -1px">Pick your crews</h1>
<p style="margin: 0 0 14px; font-size: 14px; color: #9A9AA5">Picked for CSE · 3rd yr · Coding, Startups</p>

<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.4px; color: #9A9AA5; margin-bottom: 8px">CLUBS AT ATRIA</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{clubs}}" as="c" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; background: #17171B; border: 1px solid #26262D; border-radius: 16px; padding: 10px 12px">
<span style="width: 44px; height: 44px; border-radius: 14px; background: {{c.tint}}; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 11px; font-weight: 800">{{c.short}}</span>
<span style="flex: 1; min-width: 0"><span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800">{{c.name}} <span style="background: #D4FF3A; color: #0D0D0F; font-size: 9px; font-weight: 800; padding: 2px 5px; border-radius: 6px">✓</span></span><span style="display: block; font-size: 12px; color: #9A9AA5">{{c.meta}}</span></span>
<button onClick="{{c.toggle}}" style="border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 12px; min-height: 36px; border-radius: 12px; white-space: nowrap">{{c.label}}</button>
</div>
</sc-for>
</div>

<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.4px; color: #9A9AA5; margin: 18px 0 8px">OFFICIAL NOTICES</div>
<div style="display: flex; align-items: center; gap: 12px; background: #17171B; border: 1px solid #26262D; border-radius: 16px; padding: 10px 12px">
<span style="width: 44px; height: 44px; border-radius: 14px; background: #F5F5F0; color: #0D0D0F; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10 12 4l9 6M5 10v9M19 10v9M9 10v9M15 10v9M3 21h18"/></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 800">Atria Office of Students</span><span style="display: block; font-size: 12px; color: #9A9AA5">Official college · posts notices only</span></span>
<button onClick="{{toggleNotice}}" style="border: 1.5px solid {{nBorder}}; background: {{nBg}}; color: {{nFg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 12px; min-height: 36px; border-radius: 12px">{{nLabel}}</button>
</div>

<div style="flex: 1"></div>
<a href="A9-Guidelines.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Next</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { j: { gdg: true }, notice: true }; }
renderVals() {
const data = [
{ id: 'gdg', short: 'GDG', name: 'GDG Atria', meta: 'Tech · 142 members · open', tint: '#D4FF3A', mode: 'open' },
{ id: 'robo', short: 'RBX', name: 'Robotics Society', meta: 'Tech · 116 members · approval', tint: '#B49CFF', mode: 'approval' },
{ id: 'ecell', short: 'E-C', name: 'E-Cell Atria', meta: 'Startups · 98 members · open', tint: '#FF6B9A', mode: 'open' },
{ id: 'cubs', short: 'CUBS', name: 'CUBS Sports', meta: 'Sports · 210 members · open', tint: '#5CC8FF', mode: 'open' }
];
const j = this.state.j;
const clubs = data.map((c) => {
const on = !!j[c.id];
const label = on ? (c.mode === 'approval' ? 'Pending' : 'Joined ✓') : (c.mode === 'approval' ? 'Request' : 'Join');
return { ...c, label: label, bg: on ? 'transparent' : '#D4FF3A', fg: on ? '#F5F5F0' : '#0D0D0F', border: on ? '#4A4A54' : '#D4FF3A', toggle: () => this.setState({ j: { ...j, [c.id]: !on } }) };
});
const n = this.state.notice;
return { clubs: clubs, nLabel: n ? 'Following' : 'Follow', nBg: n ? 'transparent' : '#D4FF3A', nFg: n ? '#F5F5F0' : '#0D0D0F', nBorder: n ? '#4A4A54' : '#D4FF3A', toggleNotice: () => this.setState({ notice: !n }) };
}
}
</script>
</body>
</html>

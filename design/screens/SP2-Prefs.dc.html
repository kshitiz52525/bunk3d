<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Discover settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="SP1-Deck.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.6px">Spark settings</h1>
</div>
<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">

<div style="background: {{heroBg}}; color: {{heroFg}}; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 12px">
<div style="flex: 1"><div style="font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800">{{heroTitle}}</div><div style="font-size: 12px; font-weight: 600; margin-top: 4px; line-height: 1.4">{{heroSub}}</div></div>
<button onClick="{{toggleOn}}" role="switch" aria-checked="{{on}}" aria-label="Show me in Discover" style="width: 58px; height: 34px; border: 0; border-radius: 17px; background: {{swBg}}; position: relative; flex-shrink: 0"><span style="position: absolute; top: 4px; left: {{knob}}px; width: 26px; height: 26px; border-radius: 13px; background: {{knobBg}}"></span></button>
</div>

<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5">I’M HERE FOR</div>
<div style="display: flex; flex-wrap: wrap; gap: 7px">
<sc-for list="{{intents}}" as="i" hint-placeholder-count="5"><button onClick="{{i.pick}}" style="border: 1.5px solid {{i.border}}; background: {{i.bg}}; color: {{i.fg}}; font: inherit; font-size: 13px; font-weight: 800; padding: 0 14px; min-height: 40px; border-radius: 20px">{{i.label}}</button></sc-for>
</div>
<div style="font-size: 12px; color: #9A9AA5; line-height: 1.45">Spark is for friends, study partners and squads. It’s not a dating app — romantic or sexual approaches get you removed.</div>

<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5; margin-top: 4px">WHO CAN SEE ME</div>
<div style="background: #17171B; border: 1px solid #26262D; border-radius: 16px; padding: 4px 14px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" style="width: 100%; display: flex; justify-content: space-between; align-items: center; border: 0; border-bottom: 1px solid #222228; background: transparent; color: #F5F5F0; font: inherit; padding: 12px 0; text-align: left"><span><span style="display: block; font-size: 14px; font-weight: 700">{{f.label}}</span><span style="display: block; font-size: 12px; color: #9A9AA5">{{f.sub}}</span></span><span style="font-size: 13px; font-weight: 800; color: {{f.color}}">{{f.val}}</span></button>
</sc-for>
</div>

<div style="background: #17171B; border: 1px solid #26262D; border-radius: 16px; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
<span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 700">Pause for a week</span><span style="display: block; font-size: 12px; color: #9A9AA5">Hidden from decks; chats stay</span></span>
<button onClick="{{togglePause}}" style="border: 1.5px solid #2E2E36; background: {{pauseBg}}; color: {{pauseFg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 12px; min-height: 36px; border-radius: 12px">{{pauseLabel}}</button>
</div>
<div style="font-size: 11px; color: #9A9AA5; text-align: center">18+ verified students only · Blocked people never see you</div>
</div>
<div style="padding: 10px 16px 26px"><a href="SP1-Deck.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 54px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 15px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Save</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { on: false, picks: { Friends: true, Study: true }, f: { year: 0, campus: 0, clubs: 0 }, paused: false }; }
renderVals() {
const on = this.state.on;
const intents = ['Friends', 'Study', 'Sports', 'Events', 'Hangouts'].map((l) => { const s = !!this.state.picks[l]; return { label: (s ? '✓ ' : '') + l, bg: s ? '#D4FF3A' : 'transparent', fg: s ? '#0D0D0F' : '#C9C9C3', border: s ? '#D4FF3A' : '#2E2E36', pick: () => this.setState({ picks: { ...this.state.picks, [l]: !s } }) }; });
const opts = { year: ['Any year', 'My year ±1', 'My year only'], campus: ['My campus', 'Nearby campuses'], clubs: ['Anyone', 'Shared clubs first'] };
const meta = { year: ['Year', 'Batch range shown to you'], campus: ['Campus', 'Inter-college once your campus is in wave 4'], clubs: ['Priority', 'How the deck is ordered'] };
const filters = Object.keys(opts).map((k) => { const v = this.state.f[k]; return { label: meta[k][0], sub: meta[k][1], val: opts[k][v] + ' ›', color: '#D4FF3A', pick: () => this.setState({ f: { ...this.state.f, [k]: (v + 1) % opts[k].length } }) }; });
const p = this.state.paused;
return {
on: on ? 'true' : 'false', intents: intents, filters: filters,
heroBg: on ? '#D4FF3A' : '#17171B', heroFg: on ? '#0D0D0F' : '#F5F5F0',
heroTitle: on ? 'You’re in the deck' : 'Discover is off',
heroSub: on ? 'Verified students on your campus can see your Spark card.' : 'Off by default. Nobody sees you until you switch this on.',
swBg: on ? '#0D0D0F' : '#2E2E36', knob: on ? 28 : 4, knobBg: on ? '#D4FF3A' : '#9A9AA5',
toggleOn: () => this.setState({ on: !on }),
pauseLabel: p ? 'Paused · undo' : 'Pause', pauseBg: p ? '#3D2E0D' : 'transparent', pauseFg: p ? '#FFD58A' : '#F5F5F0',
togglePause: () => this.setState({ paused: !p })
};
}
}
</script>
</body>
</html>

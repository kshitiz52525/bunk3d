<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Invites</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
@keyframes bkOvIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes bkOvUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bk-ovs{animation:bkOvUp 260ms cubic-bezier(.2,.8,.2,1)}
.bk-ov{animation:bkOvIn 260ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.bk-ov{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="SP1-Deck.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.6px">Invites</h1>
</div>
<div style="padding: 0 16px"><div style="display: flex; background: #17171B; border-radius: 14px; padding: 4px; gap: 4px">
<button onClick="{{showIn}}" style="flex: 1; border: 0; background: {{aBg}}; color: {{aFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 42px; border-radius: 11px">Received · {{inCount}}</button>
<button onClick="{{showOut}}" style="flex: 1; border: 0; background: {{bBg}}; color: {{bFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 42px; border-radius: 11px">Sent · 2</button>
</div></div>

<div style="flex: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px">
<sc-if value="{{isIn}}" hint-placeholder-val="{{true}}">
<sc-for list="{{inbox}}" as="v" hint-placeholder-count="2">
<div style="background: #17171B; border: 1px solid #26262D; border-radius: 20px; padding: 14px">
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 42px; height: 42px; border-radius: 14px; background: {{v.tint}}; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 12px; font-weight: 800; transform: rotate(-4deg)">{{v.ini}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">{{v.name}}</span><span style="display: block; font-size: 12px; color: #9A9AA5">{{v.meta}}</span></span><span style="font-size: 11px; color: #9A9AA5">{{v.exp}}</span></div>
<div style="background: #0D0D0F; border-radius: 14px; padding: 12px; margin-top: 10px"><div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 800">{{v.plan}}</div><div style="font-size: 12px; color: #9A9AA5; margin-top: 3px">{{v.where}}</div><div style="font-size: 13px; margin-top: 8px">“{{v.msg}}”</div></div>
<sc-if value="{{v.pending}}" hint-placeholder-val="{{true}}">
<div style="display: flex; gap: 6px; margin-top: 10px">
<button onClick="{{v.accept}}" style="flex: 1.3; border: 0; background: #D4FF3A; color: #0D0D0F; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">Accept</button>
<button onClick="{{v.suggest}}" style="flex: 1.3; border: 1.5px solid #2E2E36; background: transparent; color: #F5F5F0; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">Suggest time</button>
<button onClick="{{v.decline}}" style="flex: 1; border: 0; background: #1F1F25; color: #C9C9C3; font: inherit; font-size: 13px; font-weight: 700; min-height: 44px; border-radius: 12px">Decline</button>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: #9A9AA5"><span>Declines are silent</span><a href="#open-X3" onClick="{{ovOpen_X3}}" style="color: #FF5D5D; font-weight: 800; text-decoration: none">Report</a></div>
</sc-if>
<sc-if value="{{v.done}}" hint-placeholder-val="{{false}}"><div style="margin-top: 10px; font-size: 13px; font-weight: 800; color: {{v.doneColor}}">{{v.doneText}}</div></sc-if>
</div>
</sc-for>
</sc-if>
<sc-if value="{{isOut}}" hint-placeholder-val="{{false}}">
<sc-for list="{{outbox}}" as="o" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; background: #17171B; border: 1px solid #26262D; border-radius: 18px; padding: 12px">
<span style="width: 42px; height: 42px; border-radius: 14px; background: {{o.tint}}; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 12px; font-weight: 800">{{o.ini}}</span>
<span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 800">{{o.name}}</span><span style="display: block; font-size: 12px; color: #9A9AA5">{{o.plan}}</span></span>
<span style="font-size: 12px; font-weight: 800; color: {{o.color}}">{{o.status}}</span>
</div>
</sc-for>
<div style="font-size: 12px; color: #9A9AA5; text-align: center; margin-top: 4px">Unanswered invites expire after 48h. You never see who declined.</div>
</sc-if>
</div>
<sc-if value="{{ovShow_X3}}" hint-placeholder-val="{{false}}"><div class="bk-ovs" style="position: absolute; inset: 0; z-index: 60; overflow: hidden"><dc-import name="X3-Report" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { tab: 'in', r: {} }; }
_rv() {
const data = [
{ id: 'a', name: 'Nikhil V.', ini: 'NV', tint: '#D4FF3A', meta: '3rd yr ECE · Study', exp: '41h left', plan: 'Study sesh · Tmrw 4 PM', where: 'Library L2 pods · on campus', msg: 'grinding DSA, need someone to keep me honest' },
{ id: 'b', name: 'Kabir M.', ini: 'KM', tint: '#B49CFF', meta: '3rd yr AIML · Hangouts', exp: '22h left', plan: 'Open mic · Thu 7 PM', where: 'Lahe Lahe, Indiranagar · 14 km', msg: 'bring your guitar' }
];
const r = this.state.r;
const set = (id, v) => this.setState({ r: { ...r, [id]: v } });
const txt = { ok: ['Accepted · chat opened ›', '#3DDC97'], sug: ['Suggested Fri 5 PM · waiting', '#FFB547'], no: ['Declined quietly', '#9A9AA5'] };
const inbox = data.map((v) => ({ ...v, pending: !r[v.id], done: !!r[v.id], doneText: r[v.id] ? txt[r[v.id]][0] : '', doneColor: r[v.id] ? txt[r[v.id]][1] : '', accept: () => set(v.id, 'ok'), suggest: () => set(v.id, 'sug'), decline: () => set(v.id, 'no') }));
const outbox = [{ name: 'Sana K.', ini: 'SK', tint: '#FF6B9A', plan: 'Chai run · Today 5 PM', status: 'Sent', color: '#9A9AA5' }, { name: 'Arjun P.', ini: 'AP', tint: '#5CC8FF', plan: 'Football · Sat 11 AM', status: 'Accepted ✓', color: '#3DDC97' }];
const isIn = this.state.tab === 'in';
return { isIn: isIn, isOut: !isIn, inbox: inbox, outbox: outbox, inCount: data.filter((v) => !r[v.id]).length, aBg: isIn ? '#D4FF3A' : 'transparent', aFg: isIn ? '#0D0D0F' : '#9A9AA5', bBg: isIn ? 'transparent' : '#D4FF3A', bFg: isIn ? '#9A9AA5' : '#0D0D0F', showIn: () => this.setState({ tab: 'in' }), showOut: () => this.setState({ tab: 'out' }) };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X3"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

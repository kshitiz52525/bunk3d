<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Team registration</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<sc-if value="{{ovHas}}" hint-placeholder-val="{{false}}"><a href="#back" onClick="{{ovBack}}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if><sc-if value="{{ovNo}}" hint-placeholder-val="{{true}}"><a href="E2-EventDetail.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if>
<div style="flex: 1"><div style="font-size: 15px; font-weight: 800">Team up</div><div style="font-size: 11px; color: #9A9AA5; font-weight: 700">Hack the Canteen · teams of 2–4</div></div>
</div>

<div style="padding: 0 16px"><div style="display: flex; background: #17171B; border-radius: 16px; padding: 4px; gap: 4px">
<button onClick="{{setCreate}}" style="flex: 1; border: 0; background: {{cBg}}; color: {{cFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">Create a team</button>
<button onClick="{{setJoin}}" style="flex: 1; border: 0; background: {{jBg}}; color: {{jFg}}; font: inherit; font-size: 13px; font-weight: 800; min-height: 44px; border-radius: 12px">Join with a code</button>
</div></div>

<sc-if value="{{create}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div><label for="tn" style="font-size: 12px; font-weight: 800; color: #9A9AA5">Team name</label><input id="tn" value="Samosa Stack" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 52px; padding: 0 14px; background: #17171B; border: 1.5px solid #D4FF3A; border-radius: 14px; color: #F5F5F0; font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800"></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 800">Squad · {{count}} / 4</span><span style="font-size: 12px; font-weight: 800; color: {{minColor}}">{{minMsg}}</span></div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 10px 12px"><span style="width: 36px; height: 36px; border-radius: 18px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; font-size: 12px; font-weight: 800">AS</span><span style="flex: 1; font-size: 14px; font-weight: 700">You · captain</span><span style="font-size: 11px; font-weight: 800; color: #3DDC97">In</span></div>
<sc-for list="{{mates}}" as="m" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 10px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 10px 12px"><span style="width: 36px; height: 36px; border-radius: 18px; background: {{m.tint}}; color: #0D0D0F; display: grid; place-items: center; font-size: 12px; font-weight: 800">{{m.initials}}</span><span style="flex: 1; font-size: 14px; font-weight: 700">@{{m.user}}</span><span style="font-size: 11px; font-weight: 800; color: {{m.color}}">{{m.status}}</span></div>
</sc-for>
</div>
<div style="display: flex; gap: 8px"><input aria-label="Invite by username" value="{{draft}}" onChange="{{type}}" placeholder="@username" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 14px; background: #17171B; border: 1px solid #2E2E36; border-radius: 12px; color: #F5F5F0; font: inherit; font-size: 14px"><button onClick="{{invite}}" style="border: 0; background: #F5F5F0; color: #0D0D0F; font: inherit; font-size: 13px; font-weight: 800; padding: 0 16px; min-height: 46px; border-radius: 12px">Invite</button></div>
<div style="display: flex; align-items: center; gap: 10px; background: #17171B; border: 1px dashed #4A4A54; border-radius: 14px; padding: 10px 12px"><span style="flex: 1; font-size: 12px; color: #C9C9C3">Or share code <b style="font-family: Unbounded, sans-serif; color: #D4FF3A; letter-spacing: 2px">SMSA42</b></span><a href="SP1-Deck.dc.html" style="font-size: 12px; font-weight: 800">Find teammates in The Spark ›</a></div>
<div style="flex: 1"></div>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}"><a href="E3-Ticket.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Register Samosa Stack · free</a></sc-if>
<sc-if value="{{notReady}}" hint-placeholder-val="{{true}}"><button disabled style="border: 0; background: #2A2A31; color: #6E6E78; font: inherit; font-size: 15px; font-weight: 800; min-height: 56px; border-radius: 16px">Waiting for 1 teammate to accept</button></sc-if>
</div>
</sc-if>

<sc-if value="{{join}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<label for="code" style="font-size: 12px; font-weight: 800; color: #9A9AA5">Team code</label>
<input id="code" value="RBX907" style="height: 64px; box-sizing: border-box; padding: 0 16px; background: #17171B; border: 1.5px solid #D4FF3A; border-radius: 16px; color: #D4FF3A; font-family: Unbounded, sans-serif; font-size: 26px; font-weight: 800; letter-spacing: 6px; text-align: center">
<div style="background: #17171B; border: 1px solid #26262D; border-radius: 16px; padding: 14px"><div style="font-size: 15px; font-weight: 800">Byte Me</div><div style="font-size: 12px; color: #9A9AA5; margin-top: 2px">Captain: Rhea Nair · 2 of 4 · 2 spots open</div></div>
<div style="flex: 1"></div>
<a href="E3-Ticket.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Ask to join Byte Me</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"back":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { mode: 'create', draft: '', mates: [{ user: 'kabir.m', initials: 'KM', tint: '#5CC8FF', ok: false }] }; }
_rv() {
const s = this.state, c = s.mode === 'create';
const accepted = s.mates.filter((m) => m.ok).length + 1;
const mates = s.mates.map((m) => ({ ...m, status: m.ok ? 'Accepted' : 'Invite sent', color: m.ok ? '#3DDC97' : '#FFB547' }));
return {
create: c, join: !c, mates: mates, count: s.mates.length + 1, draft: s.draft,
ready: accepted >= 2, notReady: accepted < 2,
minMsg: accepted >= 2 ? 'Good to go' : 'Need 2 accepted', minColor: accepted >= 2 ? '#3DDC97' : '#FFB547',
cBg: c ? '#D4FF3A' : 'transparent', cFg: c ? '#0D0D0F' : '#9A9AA5', jBg: c ? 'transparent' : '#D4FF3A', jFg: c ? '#9A9AA5' : '#0D0D0F',
setCreate: () => this.setState({ mode: 'create' }), setJoin: () => this.setState({ mode: 'join' }),
type: (e) => this.setState({ draft: e.target.value }),
invite: () => { const u = s.draft.replace('@', '').trim(); if (u && s.mates.length < 3) this.setState({ draft: '', mates: s.mates.map((m) => ({ ...m, ok: true })).concat([{ user: u, initials: u.slice(0, 2).toUpperCase(), tint: '#FF6B9A', ok: false }]) }); }
};
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
[].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

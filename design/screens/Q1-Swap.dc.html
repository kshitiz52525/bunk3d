<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Hustle · Swap</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B49CFF}a:hover{color:#CDBEFF}
@keyframes bkOvIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.bk-ov{animation:bkOvIn 260ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.bk-ov{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
<div style="position: relative; width: 44px; height: 48px; flex-shrink: 0">
<a href="#open-P4" onClick="{{ovOpen_P4}}" aria-label="My Hustle portfolio" style="position: absolute; left: 2px; top: 0; width: 40px; height: 40px; border-radius: 14px; background: #B49CFF; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 13px; text-decoration: none; transform: rotate(4deg)">AS</a>
<a href="T1-Feed.dc.html" aria-label="Swipe up on your photo to switch back to the Vibe" style="position: absolute; left: 10px; bottom: -2px; width: 24px; height: 16px; border-radius: 8px; background: #0D0D0F; border: 1.5px solid #B49CFF; color: #B49CFF; display: grid; place-items: center; box-sizing: border-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></a>
</div>
<div style="flex: 1; min-width: 0"><div style="display: flex; align-items: center; gap: 6px"><span style="font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.6px">bunk<span style="color: #B49CFF">3</span>d</span><span style="background: #B49CFF; color: #0D0D0F; font-size: 9px; font-weight: 800; letter-spacing: 1px; padding: 3px 6px; border-radius: 6px; transform: rotate(-3deg)">HUSTLE</span></div><div style="font-size: 11px; color: #9A9AA5; font-weight: 700">Atria University · KYC ✓</div></div>
<a href="D1-ChatList.dc.html" aria-label="Messages" style="width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
<a href="#open-X2" onClick="{{ovOpen_X2}}" aria-label="Search" style="width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></a>
</div>

<div style="flex: 1; overflow: hidden; padding: 6px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: flex-end; justify-content: space-between"><h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -1px">Swap</h1><span style="font-size: 11px; color: #9A9AA5; font-weight: 700">Chat to buy · pay in person</span></div>
<div style="display: flex; gap: 6px; overflow: hidden">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button onClick="{{c.pick}}" style="border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 11px; min-height: 34px; border-radius: 17px; white-space: nowrap">{{c.label}}</button></sc-for>
</div>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px">
<sc-for list="{{items}}" as="i" hint-placeholder-count="4">
<a href="Q2-Listing.dc.html" style="display: block; background: #17171B; border: 1px solid #26262D; border-radius: 18px; overflow: hidden; text-decoration: none; color: #F5F5F0">
<div style="height: 112px; background: {{i.tint}}; position: relative; display: grid; place-items: center"><span style="font-family: Unbounded, sans-serif; font-size: 22px; font-weight: 800; color: rgba(13,13,15,0.25)">{{i.glyph}}</span><span style="position: absolute; left: 8px; top: 8px; background: #0D0D0F; color: {{i.tint}}; font-size: 9px; font-weight: 800; padding: 3px 6px; border-radius: 6px">{{i.cond}}</span></div>
<div style="padding: 10px"><div style="font-size: 13px; font-weight: 800; line-height: 1.25">{{i.title}}</div><div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 800; color: #B49CFF; margin-top: 4px">{{i.price}}</div><div style="font-size: 11px; color: #9A9AA5; margin-top: 2px">{{i.seller}}</div></div>
</a>
</sc-for>
</div>
</div>

<a href="Q3-CreateListing.dc.html" aria-label="Sell something" style="position: absolute; right: 16px; bottom: 98px; height: 52px; padding: 0 18px; border-radius: 18px; background: #B49CFF; color: #0D0D0F; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #D4FF3A; transform: rotate(-2deg)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Sell</a>

<nav aria-label="Hustle" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #111114; border-top: 1px solid #24242A; padding: 8px 6px 24px">
<a href="H1-Gigs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5h6v2M3 13h18"/></svg></span>Gigs</a>
<a href="H4-MyWork.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span>My Work</a>
<a href="Q1-Swap.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F5F5F0; font-size: 11px; font-weight: 800; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; border-radius: 16px; background: #B49CFF; color: #0D0D0F; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg></span>Swap</a>
<a href="B1-Bag.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg></span>My Bag</a>
</nav>
<sc-if value="{{ovShow_X2}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="X2-Search" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ovShow_P4}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="P4-Portfolio" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cat: 'All' }; }
_rv() {
const all = [
{ cat: 'Books', title: 'Grewal Engg. Maths, 44th ed', price: '₹350', seller: 'Nikhil V. · 3rd yr', tint: '#D4FF3A', glyph: 'BOOK', cond: 'GOOD' },
{ cat: 'Gear', title: 'Casio fx-991EX calculator', price: '₹700', seller: 'Sana K. · 2nd yr', tint: '#5CC8FF', glyph: 'CALC', cond: 'LIKE NEW' },
{ cat: 'Gear', title: 'Lab coat, size M', price: '₹150', seller: 'Dev R. · 1st yr', tint: '#F5F5F0', glyph: 'COAT', cond: 'USED' },
{ cat: 'Rides', title: 'Hercules cycle + lock', price: '₹2,800', seller: 'Kabir M. · 3rd yr', tint: '#FF6B9A', glyph: 'CYCLE', cond: 'GOOD' },
{ cat: 'Books', title: 'GATE ECE PYQ set', price: 'Free', seller: 'Meera T. · 2nd yr', tint: '#FFB547', glyph: 'PYQ', cond: 'NOTES' }
];
const cats = ['All', 'Books', 'Gear', 'Rides', 'Hostel'].map((l) => { const on = l === this.state.cat; return { label: l, bg: on ? '#F5F5F0' : 'transparent', fg: on ? '#0D0D0F' : '#C9C9C3', border: on ? '#F5F5F0' : '#2E2E36', pick: () => this.setState({ cat: l }) }; });
const items = this.state.cat === 'All' ? all.slice(0, 4) : all.filter((i) => i.cat === this.state.cat);
return { cats: cats, items: items };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X2", "P4"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

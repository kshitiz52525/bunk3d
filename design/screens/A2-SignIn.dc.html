<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; padding: 16px 22px 30px">
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
<button onClick="{{back}}" aria-label="Back" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5; letter-spacing: 1px">{{stepLabel}}</span>
<span style="width: 44px"></span>
</div>
<sc-if value="{{isNew}}" hint-placeholder-val="{{true}}"><div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px">
<span style="height: 5px; border-radius: 3px; background: #D4FF3A"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span><span style="height: 5px; border-radius: 3px; background: #26262D"></span>
</div></sc-if>

<sc-if value="{{start}}" hint-placeholder-val="{{true}}">
<h1 style="margin: 34px 0 8px; font-family: Unbounded, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05">{{h1a}}<br>{{h1b}}</h1>
<p style="margin: 0 0 28px; font-size: 14px; color: #9A9AA5; line-height: 1.5">Your number and email are never shown to anyone.</p>
<button onClick="{{google}}" style="display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; background: #F5F5F0; color: #0D0D0F; font: inherit; font-size: 15px; font-weight: 800; min-height: 56px; border-radius: 16px"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#0D0D0F" stroke-width="2.4"/><path d="M12 12h9" stroke="#0D0D0F" stroke-width="2.4"/></svg>Continue with Google</button>
<div style="display: flex; align-items: center; gap: 12px; margin: 22px 0; color: #6E6E78; font-size: 12px; font-weight: 700"><span style="flex: 1; height: 1px; background: #26262D"></span>OR USE YOUR NUMBER<span style="flex: 1; height: 1px; background: #26262D"></span></div>
<label for="ph" style="font-size: 12px; font-weight: 800; color: #9A9AA5">Mobile number</label>
<div style="display: flex; gap: 8px; margin-top: 8px">
<span style="display: flex; align-items: center; padding: 0 14px; height: 56px; background: #17171B; border: 1px solid #2E2E36; border-radius: 14px; font-size: 16px; font-weight: 700">+91</span>
<input id="ph" type="tel" value="98765 43210" style="flex: 1; min-width: 0; height: 56px; box-sizing: border-box; padding: 0 16px; background: #17171B; border: 1.5px solid #D4FF3A; border-radius: 14px; color: #F5F5F0; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: 0.5px">
</div>
<div style="flex: 1"></div>
<button onClick="{{sendOtp}}" style="border: 0; background: #D4FF3A; color: #0D0D0F; font: inherit; font-size: 16px; font-weight: 800; min-height: 56px; border-radius: 16px; box-shadow: 4px 4px 0 #B49CFF">Send code</button>
</sc-if>

<sc-if value="{{otp}}" hint-placeholder-val="{{false}}">
<h1 style="margin: 34px 0 8px; font-family: Unbounded, sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -1.2px; line-height: 1.05">Drop the<br>6-digit code</h1>
<p style="margin: 0 0 24px; font-size: 14px; color: #9A9AA5">Sent to +91 98765 43210 · <button onClick="{{back}}" style="border: 0; background: none; color: #D4FF3A; font: inherit; font-weight: 700; padding: 0">change</button></p>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
<span style="height: 60px; border-radius: 14px; background: #17171B; border: 2px solid {{b.border}}; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; color: {{b.color}}">{{b.d}}</span>
</sc-for>
</div>
<sc-if value="{{wrong}}" hint-placeholder-val="{{false}}"><div style="margin-top: 12px; font-size: 13px; font-weight: 700; color: #FF5D5D">Wrong code · 2 tries left</div></sc-if>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 13px; color: #9A9AA5"><span>Auto-reading SMS…</span><span>Resend in 0:24</span></div>
<div style="flex: 1"></div>
<div style="display: flex; gap: 8px">
<button onClick="{{tryWrong}}" style="flex: 1; border: 0; background: #1F1F25; color: #F5F5F0; font: inherit; font-size: 14px; font-weight: 700; min-height: 56px; border-radius: 16px">Preview error</button>
<a href="{{verifyHref}}" style="flex: 2; display: flex; justify-content: center; align-items: center; min-height: 56px; background: #D4FF3A; color: #0D0D0F; border-radius: 16px; font-size: 16px; font-weight: 800; text-decoration: none; box-shadow: 4px 4px 0 #B49CFF">Verify</a>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"returning":{"editor":"boolean","default":false,"section":"Account state"},"back":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { step: 'start', wrong: false }; }
_rv() {
const digits = this.state.wrong ? ['4', '7', '1', '9', '0', '2'] : ['4', '7', '1', '', '', ''];
const boxes = digits.map((d, i) => ({ d: d, color: this.state.wrong ? '#FF5D5D' : '#F5F5F0', border: this.state.wrong ? '#FF5D5D' : (i === 3 ? '#D4FF3A' : (d ? '#4A4A54' : '#2E2E36')) }));
const ret = !!this.props.returning;
return {
isNew: !ret, stepLabel: ret ? 'WELCOME BACK' : 'STEP 1 OF 7', h1a: ret ? 'Good to see' : 'Let’s get', h1b: ret ? 'you again.' : 'you in.', verifyHref: ret ? 'T1-Feed.dc.html' : 'A3-College.dc.html',
start: this.state.step === 'start', otp: this.state.step === 'otp', wrong: this.state.wrong, boxes: boxes,
sendOtp: () => this.setState({ step: 'otp', wrong: false }),
google: () => this.setState({ step: 'otp', wrong: false }),
back: () => { if (this.state.step === 'start' && this.props.back) this.props.back(); else this.setState({ step: 'start', wrong: false }); },
tryWrong: () => this.setState({ wrong: !this.state.wrong })
};
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
[].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

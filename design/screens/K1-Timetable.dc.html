<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Timetable</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
@keyframes bkOvIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.bk-ov{animation:bkOvIn 260ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.bk-ov{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
<div style="position: relative; width: 44px; height: 48px; flex-shrink: 0">
<a href="#open-P1" onClick="{{ovOpen_P1}}" aria-label="My profile" style="position: absolute; left: 2px; top: 0; width: 40px; height: 40px; border-radius: 14px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 13px; text-decoration: none; transform: rotate(-4deg)">AS</a>
<a href="H1-Gigs.dc.html" aria-label="Swipe up on your photo to switch to The Hustle" style="position: absolute; left: 10px; bottom: -2px; width: 24px; height: 16px; border-radius: 8px; background: #0D0D0F; border: 1.5px solid #D4FF3A; color: #D4FF3A; display: grid; place-items: center; box-sizing: border-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></a>
</div>
<div style="flex: 1; min-width: 0"><div style="font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.6px">bunk<span style="color: #D4FF3A">3</span>d</div><div style="font-size: 11px; color: #9A9AA5; font-weight: 700">Atria University</div></div>
<a href="D1-ChatList.dc.html" aria-label="DMs, 2 unread" style="position: relative; width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span style="position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 5px; background: #D4FF3A; border: 2px solid #0D0D0F"></span></a>
<a href="#open-X2" onClick="{{ovOpen_X2}}" aria-label="Search" style="width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg></a>
<a href="#open-X1" onClick="{{ovOpen_X1}}" aria-label="Notices, 3 unread" style="position: relative; width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg><span style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF6B9A; color: #0D0D0F; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid #0D0D0F">3</span></a>
</div>

<div style="flex: 1; overflow: hidden; padding: 6px 16px 0">
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -1px">Study</h1>
<div style="display: flex; gap: 6px; margin-top: 12px; overflow: hidden">
<a href="N1-NotesHome.dc.html" style="border: 1px solid #2E2E36; color: #C9C9C3; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 16px; text-decoration: none; white-space: nowrap">Notes</a>
<span style="background: #D4FF3A; color: #0D0D0F; font-size: 12px; font-weight: 800; padding: 8px 12px; border-radius: 16px; white-space: nowrap">Timetable</span>
<a href="K2-Attendance.dc.html" style="border: 1px solid #2E2E36; color: #C9C9C3; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 16px; text-decoration: none; white-space: nowrap">Attendance</a>
<a href="K3-Deadlines.dc.html" style="border: 1px solid #2E2E36; color: #C9C9C3; font-size: 12px; font-weight: 700; padding: 7px 11px; border-radius: 16px; text-decoration: none; white-space: nowrap">Deadlines</a>
</div>
<div style="display: flex; align-items: center; gap: 10px; margin-top: 14px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 10px 12px">
<span style="flex: 1; font-size: 12px; color: #C9C9C3"><b style="color: #F5F5F0">CSE 5A</b> · made by Vikram P. · adopted by 54 classmates</span>
<span style="font-size: 11px; font-weight: 800; color: #3DDC97">Adopted ✓</span>
</div>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; margin-top: 12px">
<sc-for list="{{days}}" as="d" hint-placeholder-count="6">
<button onClick="{{d.pick}}" style="border: 0; background: {{d.bg}}; color: {{d.fg}}; font: inherit; border-radius: 14px; min-height: 54px; display: flex; flex-direction: column; align-items: center; justify-content: center"><span style="font-size: 11px; font-weight: 800">{{d.label}}</span><span style="font-family: Unbounded, sans-serif; font-size: 16px; font-weight: 800">{{d.date}}</span></button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; margin-top: 14px">
<sc-for list="{{classes}}" as="c" hint-placeholder-count="4">
<div style="display: flex; gap: 12px; align-items: stretch">
<div style="width: 50px; flex-shrink: 0; text-align: right; padding-top: 10px"><div style="font-size: 13px; font-weight: 800">{{c.start}}</div><div style="font-size: 11px; color: #9A9AA5">{{c.end}}</div></div>
<div style="flex: 1; background: {{c.bg}}; color: {{c.fg}}; border-radius: 16px; padding: 10px 12px; border: 1px solid {{c.border}}"><div style="display: flex; justify-content: space-between"><b style="font-size: 14px">{{c.subj}}</b><span style="font-size: 11px; font-weight: 800">{{c.tag}}</span></div><div style="font-size: 12px; margin-top: 2px; opacity: 0.85">{{c.room}}</div></div>
</div>
</sc-for>
</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 12px; font-size: 12px; color: #9A9AA5"><span>Reminder 10 min before each class</span><span style="color: #D4FF3A; font-weight: 800">On</span></div>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #111114; border-top: 1px solid #24242A; padding: 8px 6px 24px">
<a href="T1-Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h2a2 2 0 0 1 0 4h-2"/></svg></span>Tea</a>
<a href="N1-NotesHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F5F5F0; font-size: 11px; font-weight: 800; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; border-radius: 16px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/></svg></span>Study</a>
<a href="E1-Events.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg></span>Poppin’</a>
<a href="C1-Clubs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></span>Crew</a>
<a href="SP1-Deck.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Discover</a>
</nav>
<sc-if value="{{ovShow_X1}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="X1-Notices" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ovShow_X2}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="X2-Search" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ovShow_P1}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="P1-MyProfile" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { d: 1 }; }
_rv() {
const dl = [['MON', '27'], ['TUE', '28'], ['WED', '29'], ['THU', '30'], ['FRI', '31'], ['SAT', '01']];
const days = dl.map(([l, n], i) => ({ label: l, date: n, bg: i === this.state.d ? '#D4FF3A' : '#17171B', fg: i === this.state.d ? '#0D0D0F' : '#F5F5F0', pick: () => this.setState({ d: i }) }));
const plans = [
[['9:00', '9:55', 'DBMS', 'Room 304 · Prof. Rao', 'Now'], ['10:00', '10:55', 'OS', 'Room 304 · Prof. Iyer', ''], ['11:15', '1:00', 'CN Lab', 'Lab 2 · Batch B', 'Lab'], ['2:00', '2:55', 'TOC', 'Room 210', '']],
[['9:00', '10:55', 'DBMS Lab', 'Lab 4 · Batch B', 'Now'], ['11:15', '12:10', 'CN', 'Room 304', ''], ['2:00', '2:55', 'OS', 'Room 304', '']]
];
const p = plans[this.state.d % 2];
const classes = p.map(([s, e, subj, room, tag], i) => ({ start: s, end: e, subj: subj, room: room, tag: tag, bg: i === 0 ? '#D4FF3A' : '#17171B', fg: i === 0 ? '#0D0D0F' : '#F5F5F0', border: i === 0 ? '#D4FF3A' : '#26262D' }));
return { days: days, classes: classes };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X1", "X2", "P1"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

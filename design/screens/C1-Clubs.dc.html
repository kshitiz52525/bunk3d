<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cat: 'All' }; }
_rv() {
const all = [
{ cat: 'Sports', short: 'CUBS', name: 'CUBS Sports', meta: 'Sports · 210 members · open', tint: '#5CC8FF', cta: 'Join' },
{ cat: 'Cultural', short: 'MUS', name: 'Music Society', meta: 'Cultural · 164 members · approval', tint: '#FF6B9A', cta: 'Request' },
{ cat: 'Tech', short: 'RBX', name: 'Robotics Society', meta: 'Tech · 116 members · approval', tint: '#B49CFF', cta: 'Pending' },
{ cat: 'Cultural', short: 'DRM', name: 'Dramatics Club', meta: 'Cultural · 88 members · open', tint: '#FFB547', cta: 'Join' },
{ cat: 'Tech', short: 'DSN', name: 'Design Club', meta: 'Tech · 72 members · open', tint: '#D4FF3A', cta: 'Join' }
];
const cats = ['All', 'Tech', 'Cultural', 'Sports', 'Social'].map((l) => {
const on = l === this.state.cat;
return { label: l, bg: on ? '#F5F5F0' : 'transparent', fg: on ? '#0D0D0F' : '#C9C9C3', border: on ? '#F5F5F0' : '#2E2E36', pick: () => this.setState({ cat: l }) };
});
const clubs = this.state.cat === 'All' ? all.slice(0, 4) : all.filter((c) => c.cat === this.state.cat);
return { cats: cats, clubs: clubs };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X1", "X2", "P1"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>

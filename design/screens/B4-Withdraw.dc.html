<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Withdraw</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B49CFF}a:hover{color:#CDBEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="B1-Bag.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.6px">Withdraw</h1>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
<div style="text-align: center; padding-top: 20px"><div style="font-size: 12px; color: #9A9AA5; font-weight: 700">Payable ₹1,240</div><div style="font-family: Unbounded, sans-serif; font-size: 52px; font-weight: 800; letter-spacing: -2.5px; color: {{amtColor}}; margin-top: 6px">₹{{amt}}</div><div style="font-size: 12px; font-weight: 700; color: {{hintColor}}; margin-top: 4px">{{hint}}</div></div>
<div style="display: flex; gap: 7px; justify-content: center">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="3"><button onClick="{{q.pick}}" style="border: 1.5px solid #2E2E36; background: transparent; color: #F5F5F0; font: inherit; font-size: 13px; font-weight: 800; padding: 0 14px; min-height: 38px; border-radius: 19px">{{q.label}}</button></sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 4px">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12"><button onClick="{{k.press}}" aria-label="{{k.aria}}" style="border: 0; background: #17171B; color: #F5F5F0; font: inherit; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 700; min-height: 54px; border-radius: 14px">{{k.label}}</button></sc-for>
</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{speeds}}" as="s" hint-placeholder-count="2"><button onClick="{{s.pick}}" style="flex: 1; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: #F5F5F0; font: inherit; border-radius: 14px; padding: 8px 12px; text-align: left; min-height: 52px"><span style="display: block; font-size: 13px; font-weight: 800">{{s.label}}</span><span style="display: block; font-size: 11px; color: #9A9AA5">{{s.sub}}</span></button></sc-for>
</div>
<div style="display: flex; align-items: center; gap: 10px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 10px 12px"><span style="flex: 1; font-size: 13px; font-weight: 700">To aarav@okaxis</span><span style="font-size: 12px; color: #3DDC97; font-weight: 800">Verified</span></div>
</div>
<div style="padding: 10px 16px 26px"><button onClick="{{go}}" style="width: 100%; border: 0; background: {{ctaBg}}; color: {{ctaFg}}; font: inherit; font-size: 15px; font-weight: 800; min-height: 56px; border-radius: 16px">{{cta}}</button></div>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; gap: 14px">
<div style="background: #B49CFF; color: #0D0D0F; border-radius: 26px; padding: 22px; transform: rotate(-2deg); box-shadow: 5px 5px 0 #D4FF3A">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.4px">PROCESSING</div>
<div style="font-family: Unbounded, sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -1.4px; margin-top: 8px">₹{{amt}}</div>
<div style="font-size: 14px; font-weight: 700; margin-top: 6px">{{eta}} Ref WD-55102.</div>
</div>
<div style="font-size: 13px; color: #9A9AA5; text-align: center">We’ll ping you when it’s Paid. If it bounces, it returns to Payable.</div>
</div>
<div style="padding: 10px 16px 26px"><a href="B5-History.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #F5F5F0; color: #0D0D0F; border-radius: 16px; font-size: 15px; font-weight: 800; text-decoration: none">See history</a></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { v: '1240', sent: false, sp: 'std' }; }
renderVals() {
const v = this.state.v;
const n = parseInt(v || '0', 10);
const max = 1240;
const ok = n >= 100 && n <= max;
const set = (x) => this.setState({ v: x.replace(/^0+/, '').slice(0, 5) });
const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'].map((k) => ({ label: k, aria: k === '⌫' ? 'Delete' : (k || 'blank'), press: () => { if (k === '⌫') set(v.slice(0, -1)); else if (k) set(v + k); } }));
const quick = [['₹100', '100'], ['₹500', '500'], ['All', String(max)]].map((q) => ({ label: q[0], pick: () => set(q[1]) }));
const hint = n < 100 ? 'Minimum withdrawal is ₹100' : (n > max ? 'More than your Payable balance' : 'Lands in your bank, not a wallet');
const sp = this.state.sp;
const speeds = [['std', 'Standard · free', '2–3 working days'], ['inst', 'Instant · ₹15', 'usually under 1 hour']].map((s) => { const on = s[0] === sp; return { label: s[1], sub: s[2], border: on ? '#B49CFF' : '#2E2E36', bg: on ? '#2A2140' : 'transparent', pick: () => this.setState({ sp: s[0] }) }; });
const get = sp === 'inst' ? Math.max(0, n - 15) : n;
return {
speeds: speeds,
cta: sp === 'inst' ? 'Withdraw ₹' + n.toLocaleString('en-IN') + ' · you get ₹' + get.toLocaleString('en-IN') : 'Withdraw ₹' + n.toLocaleString('en-IN') + ' · free',
eta: sp === 'inst' ? 'Instant payout to aarav@okaxis. ₹15 fee taken, ₹' + get.toLocaleString('en-IN') + ' lands, usually within an hour.' : 'On its way to aarav@okaxis. Free standard payout, lands in 2–3 working days.',
editing: !this.state.sent, sent: this.state.sent, amt: n.toLocaleString('en-IN'), keys: keys, quick: quick, hint: hint,
amtColor: ok ? '#F5F5F0' : '#FF5D5D', hintColor: ok ? '#9A9AA5' : '#FF5D5D',
ctaBg: ok ? '#B49CFF' : '#26262D', ctaFg: ok ? '#0D0D0F' : '#6E6E78',
go: () => { if (ok) this.setState({ sent: true }); }
};
}
}
</script>
</body>
</html>

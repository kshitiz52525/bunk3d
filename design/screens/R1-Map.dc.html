<style>

a{color:#D4FF3A}a:hover{color:#E6FF85}

</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
<div style="position: relative; width: 44px; height: 48px; flex-shrink: 0">
<a href="#open-P1" onClick="{{ovOpen_P1}}" aria-label="My profile" style="position: absolute; left: 2px; top: 0; width: 40px; height: 40px; border-radius: 14px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 13px; text-decoration: none; transform: rotate(-4deg)">AS</a>
<a href="H1-Gigs.dc.html" aria-label="Swipe up on your photo to switch to The Hustle" style="position: absolute; left: 10px; bottom: -2px; width: 24px; height: 16px; border-radius: 8px; background: #0D0D0F; border: 1.5px solid #D4FF3A; color: #D4FF3A; display: grid; place-items: center; box-sizing: border-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></a>
</div>
<div style="flex: 1; min-width: 0"><div style="font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.6px">bunk<span style="color: #D4FF3A">3</span>d</div><div style="font-size: 11px; color: #9A9AA5; font-weight: 700">Atria University</div></div>
<a href="R5-LocationShare.dc.html" aria-label="Location sharing" style="height: 42px; padding: 0 12px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: flex; align-items: center; gap: 6px; text-decoration: none; font-size: 12px; font-weight: 800"><span style="width: 8px; height: 8px; border-radius: 4px; background: #6E6E78"></span>Ghost</a>
</div>

<div style="padding: 4px 16px 0">
<div style="display: flex; background: #17171B; border-radius: 14px; padding: 4px; gap: 4px">
<a href="SP1-Deck.dc.html" style="flex: 1; color: #9A9AA5; font-size: 13px; font-weight: 800; min-height: 40px; border-radius: 11px; display: grid; place-items: center; text-decoration: none">People · Spark</a>
<span style="flex: 1; background: #D4FF3A; color: #0D0D0F; font-size: 13px; font-weight: 800; min-height: 40px; border-radius: 11px; display: grid; place-items: center">Places · Radar</span>
</div>
<div style="display: flex; gap: 6px; margin-top: 10px; overflow: hidden">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5"><button onClick="{{c.pick}}" style="border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 11px; min-height: 34px; border-radius: 17px; white-space: nowrap">{{c.label}}</button></sc-for>
</div>
</div>

<div style="flex: 1; position: relative; margin-top: 10px; overflow: hidden; background: #141418">
<svg width="390" height="520" viewBox="0 0 390 520" style="position: absolute; inset: 0" aria-hidden="true">
<path d="M-10 120 C 90 100, 160 170, 400 130" stroke="#1F1F26" stroke-width="18" fill="none"/>
<path d="M120 -10 C 140 140, 100 300, 160 530" stroke="#1F1F26" stroke-width="14" fill="none"/>
<path d="M-10 330 L 400 290" stroke="#1F1F26" stroke-width="10" fill="none"/>
<path d="M260 -10 C 250 200, 300 330, 280 530" stroke="#1C1C22" stroke-width="8" fill="none"/>
<rect x="170" y="170" width="80" height="90" rx="16" fill="#1A2010"/>
<text x="210" y="220" text-anchor="middle" fill="#5A6B2A" font-family="Inter" font-size="10" font-weight="800">CAMPUS</text>
<circle cx="200" cy="215" r="90" fill="none" stroke="#D4FF3A" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="4 6"/>
</svg>
<sc-for list="{{pins}}" as="p" hint-placeholder-count="5">
<a href="{{p.href}}" aria-label="{{p.name}}" style="position: absolute; left: {{p.x}}px; top: {{p.y}}px; display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none">
<span style="background: {{p.bg}}; color: #0D0D0F; font-size: 11px; font-weight: 800; padding: 5px 9px; border-radius: 12px; white-space: nowrap; transform: rotate({{p.rot}}deg); box-shadow: 2px 2px 0 #0D0D0F">{{p.name}}</span>
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{p.bg}}; border: 2px solid #0D0D0F"></span>
</a>
</sc-for>
<span style="position: absolute; left: 194px; top: 236px; width: 14px; height: 14px; border-radius: 7px; background: #5CC8FF; border: 3px solid #0D0D0F; box-shadow: 0 0 0 8px rgba(92,200,255,0.18)" aria-label="You, approximate"></span>

<a href="R3-CreateMeetup.dc.html" aria-label="Create a meetup" style="position: absolute; right: 16px; bottom: 196px; width: 56px; height: 56px; border-radius: 20px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; box-shadow: 4px 4px 0 #B49CFF; transform: rotate(-4deg)"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #0D0D0F; border-radius: 24px 24px 0 0; border-top: 1px solid #26262D; padding: 8px 16px 10px">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #3A3A42; margin: 0 auto 10px"></div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px"><span style="font-size: 14px; font-weight: 800">Meetups near you</span><span style="font-size: 12px; color: #9A9AA5">{{count}} live</span></div>
<sc-for list="{{meetups}}" as="m" hint-placeholder-count="2">
<a href="R4-MeetupDetail.dc.html" style="display: flex; align-items: center; gap: 10px; background: #17171B; border: 1px solid #26262D; border-radius: 14px; padding: 10px 12px; margin-bottom: 6px; text-decoration: none; color: #F5F5F0">
<span style="background: {{m.tint}}; color: #0D0D0F; font-size: 10px; font-weight: 800; padding: 4px 7px; border-radius: 7px">{{m.when}}</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 800">{{m.title}}</span><span style="display: block; font-size: 11px; color: #9A9AA5">{{m.meta}}</span></span>
<span style="font-size: 12px; font-weight: 800; color: #D4FF3A">{{m.going}}</span>
</a>
</sc-for>
</div>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #111114; border-top: 1px solid #24242A; padding: 8px 6px 24px">
<a href="T1-Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h2a2 2 0 0 1 0 4h-2"/></svg></span>Tea</a>
<a href="N1-NotesHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"/><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"/></svg></span>Study</a>
<a href="E1-Events.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"/><path d="M13 6v12" stroke-dasharray="2 2"/></svg></span>Poppin’</a>
<a href="C1-Clubs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg></span>Crew</a>
<a href="SP1-Deck.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F5F5F0; font-size: 11px; font-weight: 800; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; border-radius: 16px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg></span>Discover</a>
</nav>
<sc-if value="{{ovShow_P1}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="P1-MyProfile" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { cat: 'All' }; }
_rv() {
const all = [
{ cat: 'Food', name: 'Third Wave', x: 36, y: 70, bg: '#FFB547', href: 'R2-Spot.dc.html', rot: -3 },
{ cat: 'Study', name: 'Library L2', x: 186, y: 140, bg: '#5CC8FF', href: 'R2-Spot.dc.html', rot: 2 },
{ cat: 'Sports', name: 'Turf 5', x: 286, y: 60, bg: '#3DDC97', href: 'R2-Spot.dc.html', rot: 3 },
{ cat: 'Meetups', name: 'Chai & Code · 6', x: 60, y: 200, bg: '#D4FF3A', href: 'R4-MeetupDetail.dc.html', rot: -2 },
{ cat: 'Hangouts', name: 'Lahe Lahe', x: 250, y: 250, bg: '#FF6B9A', href: 'R2-Spot.dc.html', rot: -4 },
{ cat: 'Food', name: 'Nandhini', x: 40, y: 290, bg: '#FFB547', href: 'R2-Spot.dc.html', rot: 2 }
];
const cats = ['All', 'Meetups', 'Food', 'Study', 'Sports', 'Hangouts'].map((l) => { const on = l === this.state.cat; return { label: l, bg: on ? '#F5F5F0' : 'transparent', fg: on ? '#0D0D0F' : '#C9C9C3', border: on ? '#F5F5F0' : '#2E2E36', pick: () => this.setState({ cat: l }) }; });
const pins = this.state.cat === 'All' ? all : all.filter((p) => p.cat === this.state.cat);
const meetups = [{ title: 'Chai & Code', meta: 'Library L2 · GDG Atria · open to campus', when: 'NOW', tint: '#D4FF3A', going: '6 going' }, { title: 'Sunday 5-a-side', meta: 'Turf 5 · Arjun P. · approval', when: 'SUN 7A', tint: '#5CC8FF', going: '8/10' }];
return { cats: cats, pins: pins, meetups: meetups, count: 2 };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["P1"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

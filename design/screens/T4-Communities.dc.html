<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Communities</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&amp;family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
@keyframes bkOvIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
.bk-ov{animation:bkOvIn 260ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.bk-ov{animation:none}}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px 8px">
<div style="position: relative; width: 44px; height: 48px; flex-shrink: 0">
<a href="#open-P1" onClick="{{ovOpen_P1}}" aria-label="My profile" style="position: absolute; left: 2px; top: 0; width: 40px; height: 40px; border-radius: 14px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-weight: 800; font-size: 13px; text-decoration: none; transform: rotate(-4deg)">AS</a>
<a href="H1-Gigs.dc.html" aria-label="Swipe up on your photo to switch to The Hustle" style="position: absolute; left: 10px; bottom: -2px; width: 24px; height: 16px; border-radius: 8px; background: #0D0D0F; border: 1.5px solid #D4FF3A; color: #D4FF3A; display: grid; place-items: center; box-sizing: border-box"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></a>
</div>
<div style="flex: 1; min-width: 0"><div style="font-family: Unbounded, sans-serif; font-size: 17px; font-weight: 800; letter-spacing: -0.6px">bunk<span style="color: #D4FF3A">3</span>d</div><div style="font-size: 11px; color: #9A9AA5; font-weight: 700">Atria University</div></div>
<a href="D1-ChatList.dc.html" aria-label="DMs, 2 unread" style="position: relative; width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"></path></svg><span style="position: absolute; top: 2px; right: 2px; width: 10px; height: 10px; border-radius: 5px; background: #D4FF3A; border: 2px solid #0D0D0F"></span></a>
<a href="#open-X2" onClick="{{ovOpen_X2}}" aria-label="Search" style="width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg></a>
<a href="#open-X1" onClick="{{ovOpen_X1}}" aria-label="Notices, 3 unread" style="position: relative; width: 42px; height: 42px; border-radius: 21px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg><span style="position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; border-radius: 9px; background: #FF6B9A; color: #0D0D0F; font-size: 10px; font-weight: 800; display: grid; place-items: center; border: 2px solid #0D0D0F">3</span></a>
</div>

<div style="display: flex; gap: 14px; align-items: baseline; padding: 6px 16px 4px">
<a href="T1-Feed.dc.html" style="font-family: Unbounded, sans-serif; font-size: 14px; font-weight: 700; color: #6E6E78; text-decoration: none">Campus</a>
<h1 style="margin: 0; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.8px">Communities</h1>
</div>
<div style="padding: 0 16px 10px; font-size: 12px; color: #9A9AA5">Cross-campus topics. Campus-only posts never show up here.</div>

<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5">JOINED</div>
<div style="display: flex; gap: 10px">
<a href="T5-CommunityFeed.dc.html" style="flex: 1; display: block; background: #D4FF3A; color: #0D0D0F; border-radius: 20px; padding: 14px; text-decoration: none; transform: rotate(-1.5deg)"><div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 800; line-height: 1.15">Placement Season 2027</div><div style="font-size: 11px; font-weight: 800; margin-top: 12px">14 colleges · 12 new</div></a>
<div style="flex: 1; background: #B49CFF; color: #0D0D0F; border-radius: 20px; padding: 14px; transform: rotate(1.5deg)"><div style="font-family: Unbounded, sans-serif; font-size: 15px; font-weight: 800; line-height: 1.15">Bengaluru PG Life</div><div style="font-size: 11px; font-weight: 800; margin-top: 12px">9 colleges · 4 new</div></div>
</div>
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5; margin-top: 8px">DISCOVER</div>
<sc-for list="{{list}}" as="c" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; background: #17171B; border: 1px solid #26262D; border-radius: 18px; padding: 12px">
<span style="width: 46px; height: 46px; border-radius: 15px; background: {{c.tint}}; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 12px; font-weight: 800">{{c.short}}</span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 14px; font-weight: 800">{{c.name}}</span><span style="display: block; font-size: 12px; color: #9A9AA5">{{c.meta}}</span></span>
<button onClick="{{c.toggle}}" style="border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 12px; min-height: 36px; border-radius: 12px">{{c.label}}</button>
</div>
</sc-for>
</div>

<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #111114; border-top: 1px solid #24242A; padding: 8px 6px 24px">
<a href="T1-Feed.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #F5F5F0; font-size: 11px; font-weight: 800; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; border-radius: 16px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"></path><path d="M17 10h2a2 2 0 0 1 0 4h-2"></path></svg></span>Tea</a>
<a href="N1-NotesHome.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H19v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H19v-3"></path></svg></span>Study</a>
<a href="E1-Events.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9V6h18v3a3 3 0 0 0 0 6v3H3v-3a3 3 0 0 0 0-6z"></path><path d="M13 6v12" stroke-dasharray="2 2"></path></svg></span>Poppin’</a>
<a href="C1-Clubs.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"></path></svg></span>Crew</a>
<a href="SP1-Deck.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; color: #8E8E99; font-size: 11px; font-weight: 700; text-decoration: none; min-height: 48px"><span style="width: 52px; height: 32px; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg></span>Discover</a>
</nav>
<sc-if value="{{ovShow_X1}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="X1-Notices" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ovShow_X2}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="X2-Search" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
<sc-if value="{{ovShow_P1}}" hint-placeholder-val="{{false}}"><div class="bk-ov" style="position: absolute; inset: 0; z-index: 60; overflow: hidden; background: #0D0D0F"><dc-import name="P1-MyProfile" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { j: {} }; }
_rv() {
const data = [
{ id: 'bgmi', short: 'BGMI', name: 'BGMI Campus League', meta: '22 colleges · 3.1k members', tint: '#FF6B9A' },
{ id: 'hack', short: 'HCK', name: 'Hackathon Hunters BLR', meta: '17 colleges · 1.8k members', tint: '#5CC8FF' },
{ id: 'gate', short: 'GATE', name: 'GATE 2027 Prep', meta: '31 colleges · 4.4k members', tint: '#FFB547' },
{ id: 'film', short: 'FILM', name: 'Campus Film Club', meta: '8 colleges · 640 members', tint: '#3DDC97' }
];
const j = this.state.j;
const list = data.map((c) => ({ ...c, label: j[c.id] ? 'Joined ✓' : 'Join', bg: j[c.id] ? 'transparent' : '#D4FF3A', fg: j[c.id] ? '#F5F5F0' : '#0D0D0F', border: j[c.id] ? '#4A4A54' : '#D4FF3A', toggle: () => this.setState({ j: { ...j, [c.id]: !j[c.id] } }) }));
return { list: list };
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X1", "X2", "P1"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

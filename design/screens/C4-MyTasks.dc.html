<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My club tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="C1-Clubs.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.6px">My tasks</h1>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5">3 clubs</span>
</div>
<div style="display: flex; gap: 7px; padding: 0 16px 12px">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button onClick="{{f.pick}}" style="border: 1px solid {{f.border}}; background: {{f.bg}}; color: {{f.fg}}; font: inherit; font-size: 12px; font-weight: 800; padding: 0 12px; min-height: 34px; border-radius: 17px">{{f.label}}</button>
</sc-for>
</div>
<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="2">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: {{g.color}}; margin-top: 4px">{{g.label}}</div>
<sc-for list="{{g.items}}" as="t" hint-placeholder-count="2">
<a href="C5-TaskDetail.dc.html" style="display: block; background: #17171B; border: 1px solid #26262D; border-radius: 18px; padding: 14px; text-decoration: none; color: #F5F5F0">
<div style="display: flex; align-items: center; gap: 8px"><span style="width: 28px; height: 28px; border-radius: 9px; background: {{t.tint}}; color: #0D0D0F; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 8px; font-weight: 800">{{t.club}}</span><span style="flex: 1; font-size: 12px; color: #9A9AA5; font-weight: 700">{{t.clubName}} · from {{t.from}}</span><span style="background: {{t.payBg}}; color: {{t.payFg}}; font-size: 11px; font-weight: 800; padding: 4px 8px; border-radius: 9px">{{t.pay}}</span></div>
<div style="font-size: 15px; font-weight: 800; margin-top: 10px">{{t.title}}</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px"><span style="font-size: 12px; font-weight: 800; color: {{t.stColor}}">{{t.status}}</span><span style="font-size: 12px; color: #9A9AA5">{{t.due}}</span></div>
</a>
</sc-for>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { f: 'Open' }; }
renderVals() {
const all = [
{ g: 'DUE THIS WEEK', club: 'GDG', clubName: 'GDG Atria', tint: '#D4FF3A', from: 'Rhea', title: 'Design Hack the Canteen posters', status: 'Waiting on you', stColor: '#FFB547', due: 'Sun 2 Nov', pay: '+120 XP', payBg: '#1E2A4A', payFg: '#8FB8FF', open: true },
{ g: 'DUE THIS WEEK', club: 'E-C', clubName: 'E-Cell Atria', tint: '#B49CFF', from: 'Tanvi', title: 'Staff the startup expo help desk', status: 'In progress', stColor: '#5CC8FF', due: 'Thu 30 Oct', pay: 'Paid · ₹800', payBg: '#D4FF3A', payFg: '#0D0D0F', open: true },
{ g: 'NEXT WEEK', club: 'CUBS', clubName: 'CUBS Sports', tint: '#5CC8FF', from: 'Arjun', title: 'Score-keeping, football cup day 1', status: 'Accepted', stColor: '#5CC8FF', due: 'Sat 8 Nov', pay: 'Certificate', payBg: '#26262D', payFg: '#F5F5F0', open: true },
{ g: 'DONE', club: 'GDG', clubName: 'GDG Atria', tint: '#D4FF3A', from: 'Rhea', title: 'Flutter workshop slides', status: 'Approved ✓', stColor: '#3DDC97', due: '18 Oct', pay: '+80 XP', payBg: '#1E2A4A', payFg: '#8FB8FF', open: false }
];
const f = this.state.f;
const shown = all.filter((t) => f === 'Open' ? t.open : (f === 'Paid' ? t.pay.indexOf('Paid') === 0 : !t.open));
const order = ['DUE THIS WEEK', 'NEXT WEEK', 'DONE'];
const groups = order.map((g) => ({ label: g, color: g === 'DUE THIS WEEK' ? '#FF6B9A' : '#9A9AA5', items: shown.filter((t) => t.g === g) })).filter((g) => g.items.length);
const filters = ['Open', 'Paid', 'Done'].map((l) => { const on = l === f; return { label: l, bg: on ? '#F5F5F0' : 'transparent', fg: on ? '#0D0D0F' : '#C9C9C3', border: on ? '#F5F5F0' : '#2E2E36', pick: () => this.setState({ f: l }) }; });
return { groups: groups, filters: filters };
}
}
</script>
</body>
</html>

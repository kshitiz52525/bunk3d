<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chat with Rhea</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D4FF3A}a:hover{color:#E6FF85}
@keyframes bkOvIn{from{transform:translateX(28px);opacity:0}to{transform:none;opacity:1}}
@keyframes bkOvUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.bk-ovs{animation:bkOvUp 260ms cubic-bezier(.2,.8,.2,1)}
.bk-ov{animation:bkOvIn 260ms cubic-bezier(.2,.8,.2,1)}
@media (prefers-reduced-motion: reduce){.bk-ov{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #1C1C21">
<sc-if value="{{ovHas}}" hint-placeholder-val="{{false}}"><a href="#back" onClick="{{ovBack}}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if><sc-if value="{{ovNo}}" hint-placeholder-val="{{true}}"><a href="D1-ChatList.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a></sc-if>
<a href="P2-OtherProfile.dc.html" style="display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; text-decoration: none; color: #F5F5F0">
<span style="width: 40px; height: 40px; border-radius: 20px; background: #B49CFF; color: #0D0D0F; display: grid; place-items: center; font-size: 13px; font-weight: 800">RN</span>
<span><span style="display: block; font-size: 15px; font-weight: 800">Rhea Nair <span style="color: #3DDC97">✓</span></span><span style="display: block; font-size: 11px; color: #3DDC97; font-weight: 700">{{status}}</span></span>
</a>
<button onClick="{{menu}}" aria-label="Chat options" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #1F1F25; color: #F5F5F0; font-weight: 800">···</button>
</div>

<sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
<div style="position: absolute; right: 14px; top: 64px; z-index: 2; width: 200px; background: #1F1F25; border: 1px solid #33333B; border-radius: 16px; padding: 6px; box-shadow: 0 18px 40px rgba(0,0,0,0.6)">
<div style="padding: 12px; font-size: 14px; font-weight: 700">Turn off read receipts</div>
<div style="padding: 12px; font-size: 14px; font-weight: 700">Mute</div>
<a href="#open-X3" onClick="{{ovOpen_X3}}" style="display: block; padding: 12px; font-size: 14px; font-weight: 700; color: #FF6B9A; text-decoration: none">Report</a>
<div style="padding: 12px; font-size: 14px; font-weight: 700; color: #FF5D5D">Block Rhea</div>
</div>
</sc-if>

<div style="flex: 1; overflow: hidden; padding: 14px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end">
<div style="align-self: center; font-size: 11px; font-weight: 800; color: #6E6E78; letter-spacing: 1px">TODAY</div>
<div style="align-self: flex-start; max-width: 76%; background: #1F1F25; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.4">saw your name on the Hack the Canteen list</div>
<div style="align-self: flex-start; max-width: 76%; background: #1F1F25; border-radius: 20px 20px 20px 6px; padding: 10px 14px; font-size: 14px; line-height: 1.4">wait you’re in too?? team?</div>
<div style="align-self: flex-end; max-width: 76%; background: #D4FF3A; color: #0D0D0F; border-radius: 20px 20px 6px 20px; padding: 10px 14px; font-size: 14px; font-weight: 600; line-height: 1.4">yesss. I have a canteen-queue idea</div>
<div style="align-self: flex-end; width: 200px; height: 130px; border-radius: 18px; background: #2A3A12; position: relative; overflow: hidden"><span style="position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 800; color: #D4FF3A; background: #0D0D0F; padding: 4px 8px; border-radius: 8px">[PHOTO] sketch.jpg</span></div>
<sc-for list="{{msgs}}" as="m" hint-placeholder-count="0">
<div style="align-self: flex-end; max-width: 76%; background: #D4FF3A; color: #0D0D0F; border-radius: 20px 20px 6px 20px; padding: 10px 14px; font-size: 14px; font-weight: 600; line-height: 1.4">{{m.text}}</div>
</sc-for>
<div style="align-self: flex-end; font-size: 11px; color: #9A9AA5; font-weight: 700">Read 4:31 PM</div>
<sc-if value="{{typing}}" hint-placeholder-val="{{true}}"><div style="align-self: flex-start; display: flex; gap: 4px; background: #1F1F25; border-radius: 16px; padding: 12px 14px"><span style="width: 7px; height: 7px; border-radius: 4px; background: #9A9AA5"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #9A9AA5"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: #9A9AA5"></span></div></sc-if>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 14px 26px; background: #111114; border-top: 1px solid #24242A">
<button aria-label="Send a photo" style="width: 46px; height: 46px; border: 0; border-radius: 23px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.8"/><path d="M21 16l-5-5-8 8"/></svg></button>
<input aria-label="Message" value="{{draft}}" onChange="{{type}}" placeholder="Message Rhea" style="flex: 1; min-width: 0; height: 46px; box-sizing: border-box; padding: 0 16px; background: #1F1F25; border: 1px solid #2E2E36; border-radius: 23px; color: #F5F5F0; font: inherit; font-size: 14px">
<button onClick="{{send}}" aria-label="Send" style="width: 46px; height: 46px; border: 0; border-radius: 23px; background: #D4FF3A; color: #0D0D0F; display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
</div>
<sc-if value="{{ovShow_X3}}" hint-placeholder-val="{{false}}"><div class="bk-ovs" style="position: absolute; inset: 0; z-index: 60; overflow: hidden"><dc-import name="X3-Report" back="{{ovClose}}"  hint-size="390px,844px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"back":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { msgs: [], draft: '', menu: false }; }
_rv() {
const s = this.state;
return {
msgs: s.msgs, draft: s.draft, menuOpen: s.menu, typing: s.msgs.length === 0,
status: s.msgs.length === 0 ? 'typing…' : 'Active now',
menu: () => this.setState({ menu: !s.menu }),
type: (e) => this.setState({ draft: e.target.value }),
send: () => { if (s.draft.trim()) this.setState({ msgs: s.msgs.concat([{ text: s.draft.trim() }]).slice(-2), draft: '' }); }
};
}
renderVals() {
const v = this._rv() || {};
const b = this.props.back;
v.ovHas = !!b; v.ovNo = !b;
v.ovBack = (e) => { if (e && e.preventDefault) e.preventDefault(); if (b) b(); };
const cur = this.state ? this.state.__ov : null;
v.ovClose = () => this.setState({ __ov: null });
["X3"].forEach((k) => { v["ovShow_" + k] = cur === k; v["ovOpen_" + k] = (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ __ov: k }); }; });
return v;
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Payout setup</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B49CFF}a:hover{color:#CDBEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="B1-Bag.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<h1 style="margin: 0; flex: 1; font-family: Unbounded, sans-serif; font-size: 20px; font-weight: 800; letter-spacing: -0.6px">Payout setup</h1>
<span style="font-size: 12px; font-weight: 800; color: #9A9AA5">{{doneCount}}/3</span>
</div>
<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 10px">
<div style="font-size: 13px; color: #9A9AA5; line-height: 1.45">Needed once, before your first withdrawal. Required by RBI rules for payouts — we never show this to payers.</div>

<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="background: #17171B; border: 1.5px solid {{s.border}}; border-radius: 18px; padding: 14px">
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 30px; height: 30px; border-radius: 10px; background: {{s.badgeBg}}; color: {{s.badgeFg}}; display: grid; place-items: center; font-family: Unbounded, sans-serif; font-size: 13px; font-weight: 800">{{s.badge}}</span><span style="flex: 1"><span style="display: block; font-size: 15px; font-weight: 800">{{s.title}}</span><span style="display: block; font-size: 12px; color: {{s.subColor}}">{{s.sub}}</span></span></div>
<sc-if value="{{s.active}}" hint-placeholder-val="{{false}}">
<div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="min-height: 48px; border-radius: 12px; border: 1px solid #2E2E36; background: #0D0D0F; display: flex; align-items: center; padding: 0 12px; font-size: 14px; color: #C9C9C3">{{s.field}}</div>
<div style="font-size: 12px; color: #9A9AA5; line-height: 1.45">{{s.note}}</div>
<button onClick="{{s.go}}" style="border: 0; background: #B49CFF; color: #0D0D0F; font: inherit; font-size: 14px; font-weight: 800; min-height: 48px; border-radius: 12px">{{s.cta}}</button>
</div>
</sc-if>
</div>
</sc-for>
<sc-if value="{{allDone}}" hint-placeholder-val="{{false}}"><div style="background: #12301F; color: #9FF0C6; border-radius: 14px; padding: 12px; font-size: 13px; font-weight: 700">All set. Withdrawals go to aarav@okaxis in under 1 working day.</div></sc-if>
</div>
<div style="padding: 10px 16px 26px"><a href="B4-Withdraw.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: {{ctaBg}}; color: {{ctaFg}}; border-radius: 16px; font-size: 15px; font-weight: 800; text-decoration: none">Continue to withdraw</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { n: 1 }; }
renderVals() {
const n = this.state.n;
const D = [
{ title: 'PAN', doneSub: 'ABCDE••••F · name matches ✓', sub: 'For TDS. Must match your bank name.', field: 'ABCDE1234F', note: 'Only last 4 characters are stored in view.', cta: 'Verify PAN' },
{ title: 'UPI ID', doneSub: 'aarav@okaxis · ₹1 test credit received ✓', sub: 'We send ₹1 to confirm it’s yours.', field: 'aarav@okaxis', note: 'We’ll send ₹1 (penny drop). It’s yours to keep.', cta: 'Send ₹1 test' },
{ title: 'Payout consent', doneSub: 'Agreed 24 Oct', sub: 'Terms, TDS rules, dispute policy', field: '☑ I agree to the Payout Terms', note: 'Every gig shows your Bunk3d fee and take-home before you apply: 5% on paid work, 2.5% on club gigs, 0% on referral gigs and on your first ₹1,000. Never more than ₹1,000 a gig.', cta: 'Agree & finish' }
];
const steps = D.map((d, i) => { const done = i < n; const act = i === n; return { title: d.title, sub: done ? d.doneSub : d.sub, subColor: done ? '#3DDC97' : '#9A9AA5', field: d.field, note: d.note, cta: d.cta, active: act, border: act ? '#B49CFF' : '#26262D', badge: done ? '✓' : String(i + 1), badgeBg: done ? '#3DDC97' : (act ? '#B49CFF' : '#26262D'), badgeFg: done || act ? '#0D0D0F' : '#9A9AA5', go: () => this.setState({ n: n + 1 }) }; });
const all = n >= 3;
return { steps: steps, doneCount: Math.min(3, n), allDone: all, ctaBg: all ? '#B49CFF' : '#26262D', ctaFg: all ? '#0D0D0F' : '#6E6E78' };
}
}
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply to gig</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B49CFF}a:hover{color:#CDBEFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0D0D0F; color: #F5F5F0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px">
<a href="H2-GigDetail.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; background: #1F1F25; color: #F5F5F0; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
<div style="flex: 1"><div style="font-size: 12px; color: #9A9AA5; font-weight: 700">Campus ambassador · ₹2,500</div><div style="font-size: 15px; font-weight: 800">Apply</div></div>
</div>
<sc-if value="{{form}}" hint-placeholder-val="{{true}}">
<div style="flex: 1; overflow: hidden; padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5">WHY YOU · {{chars}}/280</div>
<textarea onInput="{{type}}" value="{{pitch}}" aria-label="Your pitch" maxlength="280" style="min-height: 120px; border-radius: 16px; border: 1.5px solid #B49CFF; background: #17171B; color: #F5F5F0; font: inherit; font-size: 14px; line-height: 1.5; padding: 12px 14px; resize: none"></textarea>
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5">ATTACH FROM PORTFOLIO</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{works}}" as="w" hint-placeholder-count="3"><button onClick="{{w.pick}}" style="flex: 1; border: 1.5px solid {{w.border}}; background: {{w.bg}}; color: #F5F5F0; font: inherit; min-height: 88px; border-radius: 14px; padding: 8px; text-align: left; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 10px; font-weight: 800; color: {{w.tagc}}">{{w.tag}}</span><span style="font-size: 12px; font-weight: 800; line-height: 1.25">{{w.label}}</span></button></sc-for>
</div>
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #9A9AA5">AVAILABLE SAT 8 NOV, 10–4?</div>
<div style="display: flex; gap: 8px">
<sc-for list="{{avail}}" as="a" hint-placeholder-count="2"><button onClick="{{a.pick}}" style="flex: 1; border: 1.5px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font: inherit; font-size: 14px; font-weight: 800; min-height: 46px; border-radius: 14px">{{a.label}}</button></sc-for>
</div>
<button onClick="{{toggleAgree}}" style="display: flex; gap: 10px; align-items: flex-start; border: 0; background: transparent; color: #C9C9C3; font: inherit; font-size: 12px; line-height: 1.45; text-align: left; padding: 4px 0"><span style="width: 22px; height: 22px; border-radius: 7px; border: 2px solid {{agreeBorder}}; background: {{agreeBg}}; color: #0D0D0F; display: grid; place-items: center; font-size: 12px; font-weight: 800; flex-shrink: 0; box-sizing: border-box">{{agreeTick}}</span><span>I’ve read the scope. Pay is ₹2,500 fixed. My 5% Bunk3d fee (₹125, plus ₹22.50 GST on it) is locked now, so I take home ₹2,352.50 after Blu Smart approves my proof. Content must carry the #ad label.</span></button>
</div>
<div style="padding: 10px 16px 26px"><button onClick="{{submit}}" style="width: 100%; border: 0; background: {{ctaBg}}; color: {{ctaFg}}; font: inherit; font-size: 15px; font-weight: 800; min-height: 56px; border-radius: 16px">Send application</button></div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; gap: 14px">
<div style="background: #B49CFF; color: #0D0D0F; border-radius: 26px; padding: 22px; transform: rotate(-2deg); box-shadow: 5px 5px 0 #D4FF3A">
<div style="font-size: 11px; font-weight: 800; letter-spacing: 1.4px">APPLIED</div>
<div style="font-family: Unbounded, sans-serif; font-size: 24px; font-weight: 800; letter-spacing: -1px; margin-top: 8px">Shot sent.</div>
<div style="font-size: 14px; font-weight: 700; margin-top: 6px">Blu Smart usually replies in 2 days. If you’re picked, it moves to My Work.</div>
</div>
</div>
<div style="padding: 10px 16px 26px"><a href="H4-MyWork.dc.html" style="display: flex; justify-content: center; align-items: center; min-height: 56px; background: #F5F5F0; color: #0D0D0F; border-radius: 16px; font-size: 15px; font-weight: 800; text-decoration: none">Go to My Work</a></div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) { super(props); this.state = { pitch: 'I run the Atria memes page (4.1k) and shot the GDG fest reels. I can do 3 reels in a weekend.', w: { a: true }, av: 'yes', agree: false, done: false }; }
renderVals() {
const st = this.state;
const works = [['a', 'REEL', '#FF6B9A', 'GDG fest recap'], ['b', 'DESIGN', '#5CC8FF', 'E-Cell posters'], ['c', 'PAID GIG', '#3DDC97', 'Expo desk ✓']].map((r) => { const on = !!st.w[r[0]]; return { tag: r[1], tagc: r[2], label: r[3], border: on ? '#B49CFF' : '#2E2E36', bg: on ? '#2A2140' : '#17171B', pick: () => this.setState({ w: { ...st.w, [r[0]]: !on } }) }; });
const avail = [['yes', 'Yes, all day'], ['part', 'Part of it']].map((r) => { const on = st.av === r[0]; return { label: r[1], bg: on ? '#B49CFF' : 'transparent', fg: on ? '#0D0D0F' : '#F5F5F0', border: on ? '#B49CFF' : '#2E2E36', pick: () => this.setState({ av: r[0] }) }; });
const ok = st.agree && st.pitch.trim().length > 10;
return {
form: !st.done, done: st.done, pitch: st.pitch, chars: st.pitch.length, works: works, avail: avail,
type: (e) => this.setState({ pitch: e.target.value }),
agreeBorder: st.agree ? '#B49CFF' : '#4A4A54', agreeBg: st.agree ? '#B49CFF' : 'transparent', agreeTick: st.agree ? '✓' : '',
toggleAgree: () => this.setState({ agree: !st.agree }),
ctaBg: ok ? '#B49CFF' : '#26262D', ctaFg: ok ? '#0D0D0F' : '#6E6E78',
submit: () => { if (ok) this.setState({ done: true }); }
};
}
}
</script>
</body>
</html>
